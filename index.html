<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha256-fx038NkLY4U1TCrBDiu5FWPEa9eiZu01EiLryshJbCo=" crossorigin="anonymous">
  <title>4択問題</title>
</head>

<body class="bg-primary-subtle min-vh-100 d-flex align-items-center py-4">
  <main class="container" style="max-width: 640px;">
    <div id="upload" class="card shadow-sm border-0 p-4">
      <h1 class="h3 mb-3">ファイルアップロード</h1>
      <p class="text-body-secondary mb-4">問題のCSVファイルを選択することで4択問題を生成します。</p>

      <div class="mb-3">
        <label for="quiz-csv-input" class="form-label">問題のCSVファイルを選択</label>
        <input class="form-control" type="file" id="quiz-csv-input" accept=".csv,text/csv">
      </div>

      <div class="mt-2">
        <a href="https://github.com/Ringoame196/choice4/blob/main/sample_data.csv" target="_blank"
          rel="noopener noreferrer" class="link-primary">サンプルデータを見る</a>
      </div>
    </div>

    <div id="quiz" hidden class="card shadow-sm border-0 p-4">
      <h1 id="quiz-title" class="h4 mb-3"></h1>
      <p id="quiz-text" class="mb-4"></p>

      <div class="d-grid gap-2">
        <button type="button" class="btn btn-outline-primary text-start py-2 px-3 choice-button" data-choice="1"
          id="a-1"></button>
        <button type="button" class="btn btn-outline-primary text-start py-2 px-3 choice-button" data-choice="2"
          id="a-2"></button>
        <button type="button" class="btn btn-outline-primary text-start py-2 px-3 choice-button" data-choice="3"
          id="a-3"></button>
        <button type="button" class="btn btn-outline-primary text-start py-2 px-3 choice-button" data-choice="4"
          id="a-4"></button>
      </div>
    </div>

    <div id="result" hidden class="card shadow-sm border-0 p-4 text-center">
      <h1 class="h3 mb-3">全問終了</h1>
      <p id="score" class="fs-4 fw-bold mb-4"></p>
      <button type="button" id="retry-button" class="btn btn-primary">別のCSVでやり直す</button>
    </div>
  </main>

  <script src="scripts/index.js"></script>
</body>

</html>
